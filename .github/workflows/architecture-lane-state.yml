          replace_once(
              'crates/ion-core/src/tests/crash_recovery.rs',
              '''    let loaded = store.load(session_id).await.expect("load");
              assert_eq!(loaded.operations.len(), 2);
              assert!(matches!(
                  loaded.operations[1].latest.1.state,
