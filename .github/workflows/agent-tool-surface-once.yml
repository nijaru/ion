name: Unified agent tool surface once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-tool-surface-once.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply corrected migration
        shell: python
        run: |
          import subprocess
          import textwrap

          path = ".github/workflows/agent-tool-surface-once.yml"
          previous = subprocess.check_output(
              ["git", "show", f"HEAD^:{path}"], text=True
          )
          marker = "      - name: Unify model-facing agent tools\n"
          start = previous.index("        run: |\n", previous.index(marker)) + len("        run: |\n")
          end = previous.index("\n      - run: cargo fmt", start)
          script = textwrap.dedent(previous[start:end])

          old = '''    let spawn = |arguments| async {
              tools
                  .iter()
                  .find(|tool| tool.spec().name == "spawn_agent")
                  .expect("spawn tool")
                  .call(arguments, CancellationToken::new())
                  .await
          };
          let handle_from = |output: &str| {
              output
                  .lines()
                  .find_map(|line| line.strip_prefix("agent handle: "))
                  .expect("agent handle")
                  .to_owned()
          };
          let wait = |handle: String| async {
              tools
                  .iter()
                  .find(|tool| tool.spec().name == "agent_wait")
                  .expect("wait tool")
                  .call(json!({"handle": handle}), CancellationToken::new())
                  .await
          };
          '''
          new = '''    let spawn_tool = tools
              .iter()
              .find(|tool| tool.spec().name == "spawn_agent")
              .expect("spawn tool")
              .clone();
          let wait_tool = tools
              .iter()
              .find(|tool| tool.spec().name == "agent_wait")
              .expect("wait tool")
              .clone();
          let handle_from = |output: &str| {
              output
                  .lines()
                  .find_map(|line| line.strip_prefix("agent handle: "))
                  .expect("agent handle")
                  .to_owned()
          };
          '''
          if old not in script:
              raise SystemExit("test helper anchor missing")
          script = script.replace(old, new, 1)
          replacements = {
              'let lane = spawn(json!({"objective": "lane work"})).await;':
                  'let lane = spawn_tool.call(json!({"objective": "lane work"}), CancellationToken::new()).await;',
              'let lane_wait = wait(lane_handle).await;':
                  'let lane_wait = wait_tool.call(json!({"handle": lane_handle}), CancellationToken::new()).await;',
              'let fresh = spawn(json!({"objective": "fresh work", "topology": "fresh"})).await;':
                  'let fresh = spawn_tool.call(json!({"objective": "fresh work", "topology": "fresh"}), CancellationToken::new()).await;',
              'let fresh_wait = wait(fresh_handle).await;':
                  'let fresh_wait = wait_tool.call(json!({"handle": fresh_handle}), CancellationToken::new()).await;',
              'let fork = spawn(json!({"objective": "fork work", "topology": "fork"})).await;':
                  'let fork = spawn_tool.call(json!({"objective": "fork work", "topology": "fork"}), CancellationToken::new()).await;',
              'let fork_wait = wait(fork_handle).await;':
                  'let fork_wait = wait_tool.call(json!({"handle": fork_handle}), CancellationToken::new()).await;',
          }
          for before, after in replacements.items():
              if before not in script:
                  raise SystemExit(f"missing call anchor: {before}")
              script = script.replace(before, after, 1)

          exec(compile(script, "agent-tool-migration.py", "exec"))
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Commit validated surface
        run: |
          rm .github/workflows/agent-tool-surface-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion-core/src/delegate.rs crates/ion-core/src/lib.rs crates/ion-core/src/tests/agent_family.rs crates/ion/src/lib.rs .github/workflows/agent-tool-surface-once.yml
          git commit -m "refactor(agent): unify lane and session tool surface"
          git push origin HEAD:main
