name: Unified agent tool surface once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-tool-surface-once.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply corrected migration
        shell: python
        run: |
          import subprocess
          import textwrap

          path = ".github/workflows/agent-tool-surface-once.yml"
          marker = "      - name: Unify model-facing agent tools\n"
          source = None
          commits = subprocess.check_output(
              ["git", "rev-list", "HEAD", "--", path], text=True
          ).splitlines()
          for commit in commits:
              candidate = subprocess.check_output(
                  ["git", "show", f"{commit}:{path}"], text=True
              )
              if marker in candidate:
                  source = candidate
                  break
          if source is None:
              raise SystemExit("original migration workflow not found")

          start = source.index("        run: |\n", source.index(marker)) + len("        run: |\n")
          end = source.index("\n      - run: cargo fmt", start)
          script = textwrap.dedent(source[start:end])

          def own_async_argument(name, parameter):
              global script
              opening = f"    let {name} = |{parameter}| async {{"
              start = script.index(opening)
              end = script.index("\n    };", start) + len("\n    };")
              block = script[start:end]
              block = block.replace(
                  opening,
                  f"    let {name} = |{parameter}| {{\n        let tools = &tools;\n        async move {{",
                  1,
              )
              block = block[:-len("\n    };")] + "\n        }\n    };"
              script = script[:start] + block + script[end:]

          own_async_argument("spawn", "arguments")
          own_async_argument("wait", "handle: String")
          exec(compile(script, "agent-tool-migration.py", "exec"))
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Commit validated surface
        run: |
          rm .github/workflows/agent-tool-surface-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion-core/src/delegate.rs crates/ion-core/src/lib.rs crates/ion-core/src/tests/agent_family.rs crates/ion/src/lib.rs .github/workflows/agent-tool-surface-once.yml
          git commit -m "refactor(agent): unify lane and session tool surface"
          git push origin HEAD:main
