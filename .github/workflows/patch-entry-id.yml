name: Patch entry-id migration

on:
  push:
    branches:
      - refactor/provision-entry-ids

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/provision-entry-ids
      - name: Apply surgical patches
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('crates/ion-core/src/runtime/mod.rs')
          text = runtime.read_text()
          old = (
              "    fn stage_entry(&mut self, entry: &SessionEntry) -> EntryRecord {\n"
              "        EntryRecord {\n"
              "            seq: self.next_entry_seq,\n"
              "            entry: entry.clone(),\n"
              "        }\n"
              "    }\n"
          )
          new = (
              "    fn stage_entry(&mut self, entry: &SessionEntry) -> EntryRecord {\n"
              "        EntryRecord::provision(self.next_entry_seq, entry.clone())\n"
              "    }\n"
          )
          if text.count(old) != 1:
              raise SystemExit('runtime stage_entry pattern did not match exactly once')
          runtime.write_text(text.replace(old, new))

          reconcile = Path('crates/ion-core/src/tests/reconcile.rs')
          text = reconcile.read_text()
          old = (
              "    let entry = EntryRecord {\n"
              "        seq: 1,\n"
              "        entry: SessionEntry::UserMessage {\n"
              "            text: \"go\".to_owned(),\n"
              "        },\n"
              "    };\n"
          )
          new = (
              "    let entry = EntryRecord::provision(\n"
              "        1,\n"
              "        SessionEntry::UserMessage {\n"
              "            text: \"go\".to_owned(),\n"
              "        },\n"
              "    );\n"
          )
          if text.count(old) != 1:
              raise SystemExit('reconcile entry pattern did not match exactly once')
          reconcile.write_text(text.replace(old, new))
          PY
          cargo fmt
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion-core/src/runtime/mod.rs crates/ion-core/src/tests/reconcile.rs
          git commit -m 'refactor(core): provision direct entry ids'
          git push origin HEAD:refactor/provision-entry-ids
