name: Hosted model override validation

on:
  push:
    branches: [agent/saturating-context-usage]
    paths:
      - .github/workflows/agent-hosted-model-override.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saturating-context-usage
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply hosted model override fix and regression
        shell: python
        run: |
          import base64
          from pathlib import Path

          old_host = base64.b64decode("").decode()
          new_host = base64.b64decode("").decode()
          host_path = Path("crates/ion-core/src/agent_host.rs")
          host = host_path.read_text()
          if old_host not in host:
              raise SystemExit("agent_host.rs override block did not match expected source")
          host_path.write_text(host.replace(old_host, new_host, 1))

          anchor = base64.b64decode("I1t0b2tpbzo6dGVzdF0KYXN5bmMgZm4gaG9zdGVkX2FnZW50X2Nhbm5vdF93aWRlbl9yZWFkX29ubHlfY2FwYWJpbGl0aWVzKCkgewo=").decode()
          regression = base64.b64decode("").decode()
          test_path = Path("crates/ion-core/src/tests/hosted_agent_invariants.rs")
          tests = test_path.read_text()
          if anchor not in tests:
              raise SystemExit("hosted_agent_invariants.rs insertion anchor did not match expected source")
          test_path.write_text(tests.replace(anchor, regression, 1))
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Commit validated source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-hosted-model-override.yml
          git add crates/ion-core/src/agent_host.rs crates/ion-core/src/tests/hosted_agent_invariants.rs
          git commit -m "fix(agent): reject unsupported hosted model overrides"
          git push
