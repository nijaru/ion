name: Final delegation fixture removal once

on:
  push:
    branches: [main]
    paths:
      - .github/final-delegate-removal.py
      - .github/workflows/final-delegate-removal-once.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply final delegation fixture removal
        run: python .github/final-delegate-removal.py
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Commit validated slice
        run: |
          rm .github/final-delegate-removal.py .github/workflows/final-delegate-removal-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(agent): remove alternate delegation runtime"
          git push origin HEAD:main
