name: Agent host migration once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-host-migration-once.yml
      - .github/agent-host-migration.py

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Collapse host agent ownership
        run: python .github/agent-host-migration.py
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Commit validated migration
        run: |
          rm .github/workflows/agent-host-migration-once.yml .github/agent-host-migration.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion/src/lib.rs crates/ion/src/main.rs crates/ion/src/acp.rs .github/workflows/agent-host-migration-once.yml .github/agent-host-migration.py
          git commit -m "refactor(host): unify agent service ownership"
          git push origin HEAD:main
