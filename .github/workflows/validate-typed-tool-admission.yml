name: Validate typed tool admission

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply typed tool-admission patch
        run: python .github/typed_tool_admission_patch.py
      - name: Validate Rust 1.98
        run: |
          cargo fmt
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DESIGN.md crates/ion-core/src crates/ion/src
          git rm -f .github/typed_tool_admission_patch.py .github/workflows/validate-typed-tool-admission.yml
          git commit -m 'refactor(core): type tool admission semantics'
          git push origin HEAD:main
