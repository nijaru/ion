name: Validate durable agent messaging

on:
  push:
    branches:
      - refactor/reopen-entry-ids

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/reopen-entry-ids
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply source patch
        run: |
          python .github/agent_message_patch_fix.py
          python .github/agent_message_patch.py
      - name: Validate Rust
        run: |
          cargo fmt
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion-core/src crates/ion/src
          git rm -f .github/agent_message_patch.py .github/agent_message_patch_fix.py .github/workflows/agent-message.yml
          git commit -m 'feat(core): add durable agent messaging'
          git push origin HEAD:refactor/reopen-entry-ids
