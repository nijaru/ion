name: Apply parent-link ownership migration

on:
  push:
    branches:
      - refactor/reopen-entry-ids

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/reopen-entry-ids
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Make entry parentage session-owned
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new))

          replace_once(
              'crates/ion-core/src/store/mod.rs',
              '''pub struct EntryRecord {
              pub id: EntryId,
              pub seq: u64,
              pub entry: SessionEntry,
          }

          impl EntryRecord {
              #[must_use]
              pub(crate) fn provision(seq: u64, entry: SessionEntry) -> Self {
                  Self {
                      id: EntryId::generate(),
                      seq,
                      entry,
                  }
              }
          }
          ''',
              '''pub struct EntryRecord {
              pub id: EntryId,
              pub seq: u64,
              /// Parent in the semantic conversation tree. Session transitions
              /// bind this before persistence; the store only validates it.
              pub(crate) parent: Option<EntryId>,
              pub entry: SessionEntry,
          }

          impl EntryRecord {
              #[must_use]
              pub(crate) fn provision(seq: u64, entry: SessionEntry) -> Self {
                  Self {
                      id: EntryId::generate(),
                      seq,
                      parent: None,
                      entry,
                  }
              }

              #[must_use]
              pub(crate) fn after(mut self, parent: Option<EntryId>) -> Self {
                  self.parent = parent;
                  self
              }
          }
          ''',
              'EntryRecord parent field',
          )

          replace_once(
              'crates/ion-core/src/runtime/mod.rs',
              '''    async fn commit_transition(&mut self, request: CommitRequest) -> Result<(), StoreError> {
                  let entries = request.entries.clone();
                  self.store.commit(request).await?;
                  self.entries.extend(entries);
                  Ok(())
              }

              fn stage_entry(&mut self, entry: &SessionEntry) -> EntryRecord {
                  EntryRecord::provision(self.next_entry_seq, entry.clone())
              }
          ''',
              '''    async fn commit_transition(
                  &mut self,
                  mut request: CommitRequest,
              ) -> Result<(), StoreError> {
                  let mut parent = self.entries.last().map(|record| record.id);
                  for entry in &mut request.entries {
                      entry.parent = parent;
                      parent = Some(entry.id);
                  }
                  let entries = request.entries.clone();
                  self.store.commit(request).await?;
                  self.entries.extend(entries);
                  Ok(())
              }

              fn stage_entry(&mut self, entry: &SessionEntry) -> EntryRecord {
                  EntryRecord::provision(self.next_entry_seq, entry.clone())
                      .after(self.entries.last().map(|record| record.id))
              }
          ''',
              'runtime commit parent binding',
          )

          replace_once(
              'crates/ion-core/src/store/sql.rs',
              '''    let (leaf_id, config): (Option<String>, String) = connection.query_row(
                  "SELECT leaf_id, config FROM lanes WHERE session_id = ?1 AND name = ?2",
                  rusqlite::params![session_id.as_uuid().to_string(), crate::session::lane::MAIN],
                  |row| Ok((row.get(0)?, row.get(1)?)),
              )?;
              let parent = leaf_id
                  .as_deref()
                  .map(|raw| {
                      crate::ids::EntryId::parse(raw).ok_or_else(|| {
                          rusqlite::Error::InvalidParameterName("main lane has invalid leaf id".to_owned())
                      })
                  })
                  .transpose()?;
              let node = crate::session::tree::Entry {
                  id: entry.id,
                  parent,
                  seq: entry.seq,
                  value: entry.entry.clone(),
              };
          ''',
              '''    let (leaf_id, config): (Option<String>, String) = connection.query_row(
                  "SELECT leaf_id, config FROM lanes WHERE session_id = ?1 AND name = ?2",
                  rusqlite::params![session_id.as_uuid().to_string(), crate::session::lane::MAIN],
                  |row| Ok((row.get(0)?, row.get(1)?)),
              )?;
              let expected_parent = leaf_id
                  .as_deref()
                  .map(|raw| {
                      crate::ids::EntryId::parse(raw).ok_or_else(|| {
                          rusqlite::Error::InvalidParameterName("main lane has invalid leaf id".to_owned())
                      })
                  })
                  .transpose()?;
              if entry.parent != expected_parent {
                  return Err(rusqlite::Error::InvalidParameterName(
                      "entry parent does not match the main lane leaf".to_owned(),
                  ));
              }
              let node = crate::session::tree::Entry {
                  id: entry.id,
                  parent: entry.parent,
                  seq: entry.seq,
                  value: entry.entry.clone(),
              };
          ''',
              'store parent validation',
          )

          replace_once(
              'crates/ion-core/src/store/sql.rs',
              '''        entries.push(EntryRecord {
                      id: node.id,
                      seq: node.seq,
                      entry: node.value,
                  });
          ''',
              '''        entries.push(EntryRecord {
                      id: node.id,
                      seq: node.seq,
                      parent: node.parent,
                      entry: node.value,
                  });
          ''',
              'load parent roundtrip',
          )

          replace_once(
              'crates/ion-core/src/store/sql.rs',
              '''        let second_record = EntryRecord::provision(
                      2,
                      SessionEntry::AssistantMessage {
                          text: "hi".to_owned(),
                      },
                  );
          ''',
              '''        let second_record = EntryRecord::provision(
                      2,
                      SessionEntry::AssistantMessage {
                          text: "hi".to_owned(),
                      },
                  )
                  .after(Some(first_expected));
          ''',
              'store test second parent',
          )
          PY
          cargo fmt
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion-core/src
          git rm .github/workflows/architecture-parent-link.yml
          git commit -m 'refactor(core): make conversation parentage session-owned'
          git push origin HEAD:refactor/reopen-entry-ids
