name: Validate family agent host wiring

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply family host-wiring patch
        run: |
          python .github/agent_host_wiring_patch.py
          python .github/agent_host_wiring_fix.py
      - name: Validate Rust 1.98
        run: |
          cargo fmt
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion-core/src crates/ion/src
          git rm -f .github/agent_host_wiring_patch.py .github/agent_host_wiring_fix.py .github/workflows/validate-agent-host-wiring.yml
          git commit -m 'feat(ion): wire family agent controls into hosts'
          git push origin HEAD:main
