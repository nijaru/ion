name: Patch reopen entry ids

on:
  push:
    branches:
      - refactor/reopen-entry-ids

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/reopen-entry-ids
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Complete reopen identity migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new))

          # Context projection accepts borrowed semantic payloads from either
          # plain slices or durable EntryRecord iterators without cloning.
          p = Path('crates/ion-core/src/context.rs')
          text = p.read_text()
          text = text.replace(
              'pub fn project(entries: &[SessionEntry], first_seq: u64) -> ContextPlan {\n'
              '    project_with_system(entries, first_seq, SYSTEM_SECTION.to_owned())\n'
              '}\n',
              "pub fn project<'a>(\n"
              "    entries: impl IntoIterator<Item = &'a SessionEntry>,\n"
              "    first_seq: u64,\n"
              ") -> ContextPlan {\n"
              "    project_with_system(entries, first_seq, SYSTEM_SECTION.to_owned())\n"
              "}\n",
          )
          text = text.replace(
              'pub fn project_with_manifest(\n'
              '    entries: &[SessionEntry],\n'
              '    first_seq: u64,\n'
              '    manifest: &ContextManifest,\n'
              ') -> ContextPlan {\n'
              '    project_with_system(entries, first_seq, manifest.system.clone())\n'
              '}\n\n'
              'fn project_with_system(entries: &[SessionEntry], first_seq: u64, system: String) -> ContextPlan {\n'
              '    let mut messages: Vec<ContextMessage> = Vec::new();\n'
              '    for (index, entry) in entries.iter().enumerate() {\n',
              "pub fn project_with_manifest<'a>(\n"
              "    entries: impl IntoIterator<Item = &'a SessionEntry>,\n"
              "    first_seq: u64,\n"
              "    manifest: &ContextManifest,\n"
              ") -> ContextPlan {\n"
              "    project_with_system(entries, first_seq, manifest.system.clone())\n"
              "}\n\n"
              "fn project_with_system<'a>(\n"
              "    entries: impl IntoIterator<Item = &'a SessionEntry>,\n"
              "    first_seq: u64,\n"
              "    system: String,\n"
              ") -> ContextPlan {\n"
              "    let mut messages: Vec<ContextMessage> = Vec::new();\n"
              "    for (index, entry) in entries.into_iter().enumerate() {\n",
          )
          p.write_text(text)

          # The live session owns durable semantic records, not a second
          # payload-only copy. All ordinary CommitRequest paths install the
          # exact provisioned records only after SQLite succeeds.
          p = Path('crates/ion-core/src/runtime/mod.rs')
          text = p.read_text()
          text = text.replace(
              '    /// Canonical semantic session view, mirroring the durable store.\n'
              '    entries: Vec<SessionEntry>,\n',
              '    /// Canonical semantic records, mirroring the durable store.\n'
              '    entries: Vec<EntryRecord>,\n',
          )
          text = text.replace(
              '        for (seq, entry) in loaded.entries {\n'
              '            max_seq = max_seq.max(seq);\n'
              '            self.entries.push(entry);\n'
              '        }\n',
              '        for record in loaded.entries {\n'
              '            max_seq = max_seq.max(record.seq);\n'
              '            self.entries.push(record);\n'
              '        }\n',
          )
          text = text.replace(
              '            .begin_operation(self.session_id, operation_id, root_inbox, checkpoint, entry)\n',
              '            .begin_operation(\n'
              '                self.session_id,\n'
              '                operation_id,\n'
              '                root_inbox,\n'
              '                checkpoint,\n'
              '                entry.clone(),\n'
              '            )\n',
          )
          text = text.replace(
              '        self.entries.extend(applied.entries.iter().cloned());\n'
              '        self.next_entry_seq += 1;\n',
              '        self.entries.push(entry);\n'
              '        self.next_entry_seq += 1;\n',
              1,
          )
          text = text.replace(
              '        let applied_entries = applied.entries.clone();\n',
              '',
          )
          text = text.replace(
              '        if applied_now {\n'
              '            self.entries.extend(applied_entries);\n'
              '        } else {\n'
              '            staged.pending_steers.push(inbox_id);\n'
              '        }\n',
              '        if !applied_now {\n'
              '            staged.pending_steers.push(inbox_id);\n'
              '        }\n',
          )
          text = text.replace(
              '        for applied in &drained {\n'
              '            self.entries.extend(applied.entries.iter().cloned());\n'
              '        }\n',
              '',
          )
          text = text.replace('        self.entries.extend(applied.entries);\n', '')
          text = text.replace(
              '    fn first_entry_seq(&self) -> u64 {\n'
              '        self.next_entry_seq - self.entries.len() as u64\n'
              '    }\n',
              '    fn first_entry_seq(&self) -> u64 {\n'
              '        self.entries\n'
              '            .first()\n'
              '            .map_or(self.next_entry_seq, |record| record.seq)\n'
              '    }\n',
          )
          text = text.replace(
              'project_with_manifest(&self.entries, self.first_entry_seq(), manifest)',
              'project_with_manifest(\n'
              '            self.entries.iter().map(|record| &record.entry),\n'
              '            self.first_entry_seq(),\n'
              '            manifest,\n'
              '        )',
          )
          text = text.replace(
              'project_with_manifest(&self.entries, self.first_entry_seq(), &manifest)',
              'project_with_manifest(\n'
              '            self.entries.iter().map(|record| &record.entry),\n'
              '            self.first_entry_seq(),\n'
              '            &manifest,\n'
              '        )',
          )
          text = text.replace(
              '            entries: self.entries.clone(),\n',
              '            entries: self\n'
              '                .entries\n'
              '                .iter()\n'
              '                .map(|record| record.entry.clone())\n'
              '                .collect(),\n',
          )
          # Route existing CommitRequest writes through the one install boundary.
          text = text.replace('self.store.commit(request).await', 'self.commit_transition(request).await')
          marker = (
              '    fn stage_entry(&mut self, entry: &SessionEntry) -> EntryRecord {\n'
              '        EntryRecord::provision(self.next_entry_seq, entry.clone())\n'
              '    }\n'
          )
          helper = (
              '    async fn commit_transition(&mut self, request: CommitRequest) -> Result<(), StoreError> {\n'
              '        let entries = request.entries.clone();\n'
              '        self.store.commit(request).await?;\n'
              '        self.entries.extend(entries);\n'
              '        Ok(())\n'
              '    }\n\n'
              + marker
          )
          if text.count(marker) != 1:
              raise SystemExit('runtime stage_entry marker did not match exactly once')
          text = text.replace(marker, helper)
          p.write_text(text)

          # Settlement and recovery paths use the same commit/install boundary;
          # remove their old payload-only live updates.
          for path in [
              'crates/ion-core/src/runtime/effects.rs',
              'crates/ion-core/src/runtime/recovery.rs',
          ]:
              p = Path(path)
              text = p.read_text()
              text = text.replace('self.store.commit(request).await', 'self.commit_transition(request).await')
              text = text.replace('        self.entries.extend(applied.entries);\n', '')
              text = text.replace('                                self.entries.extend(applied.entries);\n', '')
              text = text.replace('                        self.entries.extend(applied.entries);\n', '')
              text = text.replace(
                  'project_with_manifest(&self.entries, self.first_entry_seq(), &manifest)',
                  'project_with_manifest(\n'
                  '            self.entries.iter().map(|record| &record.entry),\n'
                  '            self.first_entry_seq(),\n'
                  '            &manifest,\n'
                  '        )',
              )
              p.write_text(text)

          # Child/delegation code consumes payloads deliberately; lane config is
          # already authoritative for model selection.
          p = Path('crates/ion-core/src/delegate.rs')
          text = p.read_text()
          text = text.replace('|(_, entry)| match entry {', '|record| match &record.entry {')
          text = text.replace('|(_, entry)| match entry {', '|record| match &record.entry {')
          old = (
              '        let model_ref = loaded\n'
              '            .entries\n'
              '            .iter()\n'
              '            .filter_map(|record| match &record.entry {\n'
              '                crate::session::SessionEntry::ModelChanged { model_ref } => Some(model_ref),\n'
              '                _ => None,\n'
              '            })\n'
              '            .next_back()\n'
              '            .cloned()\n'
              '            .unwrap_or_else(|| loaded.session.initial_model_ref.clone());\n'
          )
          if old in text:
              text = text.replace(old, '        let model_ref = loaded.session.initial_model_ref.clone();\n')
          old = (
              '    let first_seq = loaded.entries.first().map_or(1, |(seq, _)| *seq);\n'
              '    let entries: Vec<_> = loaded.entries.into_iter().map(|(_, entry)| entry).collect();\n'
              '    if entries.is_empty() {\n'
              '        return Ok(None);\n'
              '    }\n'
              '    let plan = project(&entries, first_seq);\n'
          )
          new = (
              '    if loaded.entries.is_empty() {\n'
              '        return Ok(None);\n'
              '    }\n'
              '    let first_seq = loaded.entries.first().map_or(1, |record| record.seq);\n'
              '    let plan = project(\n'
              '        loaded.entries.iter().map(|record| &record.entry),\n'
              '        first_seq,\n'
              '    );\n'
          )
          if text.count(old) != 1:
              raise SystemExit('delegate fork_context pattern did not match exactly once')
          p.write_text(text.replace(old, new))

          # ACP is a frontend projection: preserve records at the core boundary,
          # then intentionally render only semantic payloads.
          p = Path('crates/ion/src/acp.rs')
          text = p.read_text()
          text = text.replace(
              'fn replay_history(entries: &[(u64, ion_core::SessionEntry)]) -> Vec<Value> {',
              'fn replay_history(entries: &[ion_core::EntryRecord]) -> Vec<Value> {',
          )
          text = text.replace('|(_, entry)| match entry {', '|record| match &record.entry {')
          text = text.replace('    for (_, entry) in entries {\n        match entry {', '    for record in entries {\n        match &record.entry {')
          p.write_text(text)

          # Tests that inspect loaded history now name the semantic payload
          # explicitly. This is a mechanical API adaptation, not new behavior.
          for p in Path('crates/ion-core/src/tests').glob('*.rs'):
              text = p.read_text()
              text = text.replace('|(_, entry)| match entry {', '|record| match &record.entry {')
              text = text.replace('|(_, entry)| matches!(entry,', '|record| matches!(&record.entry,')
              text = text.replace('|(_, entry)| !matches!(entry,', '|record| !matches!(&record.entry,')
              text = text.replace('|(_, entry)| {', '|record| {\n            let entry = &record.entry;')
              text = text.replace('|(_, e)| entry_kind_name(e)', '|record| entry_kind_name(&record.entry)')
              text = text.replace('.last().expect("entries").1', '.last().expect("entries").entry')
              p.write_text(text)

          p = Path('crates/ion-core/src/tests/support.rs')
          text = p.read_text()
          old = 'pub(super) fn entry_kinds(entries: &[(u64, crate::SessionEntry)]) -> Vec<&\'static str> {\n'
          new = 'pub(super) fn entry_kinds(entries: &[crate::EntryRecord]) -> Vec<&\'static str> {\n'
          if text.count(old) != 1:
              raise SystemExit('entry_kinds signature did not match exactly once')
          text = text.replace(old, new)
          text = text.replace('.map(|(_, entry)| match entry {', '.map(|record| match &record.entry {')
          p.write_text(text)
          PY
          cargo fmt
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion-core/src crates/ion/src/acp.rs
          git commit -m 'refactor(core): retain entry ids in live session state'
          git push origin HEAD:refactor/reopen-entry-ids
