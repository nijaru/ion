name: Validate runtime tree and lane ownership

on:
  push:
    branches:
      - refactor/reopen-entry-ids

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/reopen-entry-ids
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply runtime and architecture patches
        run: |
          python .github/runtime_tree_lane_cache_fix.py
          python .github/runtime_tree_lane_cache_patch.py
          python .github/consolidate_design.py
      - name: Validate Rust
        run: |
          cargo fmt
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
      - name: Commit validated source and architecture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DESIGN.md crates/ion-core/src
          git rm -f docs/architecture-v2.md \
            .github/consolidate_design.py \
            .github/runtime_tree_lane_cache_fix.py \
            .github/runtime_tree_lane_cache_patch.py \
            .github/workflows/runtime-tree-lane-cache.yml
          git commit -m 'refactor(core): retain runtime tree and lane state'
          git push origin HEAD:refactor/reopen-entry-ids
