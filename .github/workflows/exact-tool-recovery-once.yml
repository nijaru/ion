name: Exact tool recovery once

on:
  push:
    branches: [main]
    paths:
      - .github/exact-tool-recovery.py
      - .github/workflows/exact-tool-recovery-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact tool recovery
        run: python .github/exact-tool-recovery.py
      - run: cargo fmt
      - run: cargo fmt --check
      - name: Strict Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee exact-tool-recovery-clippy.log
      - name: Upload Clippy diagnostic
        if: steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: exact-tool-recovery-clippy
          path: exact-tool-recovery-clippy.log
      - name: Enforce Clippy result
        if: steps.clippy.outcome == 'failure'
        run: exit 1
      - name: Workspace tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee exact-tool-recovery-tests.log
      - name: Upload test diagnostic
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: exact-tool-recovery-tests
          path: exact-tool-recovery-tests.log
      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Commit validated slice
        run: |
          rm -f exact-tool-recovery-clippy.log exact-tool-recovery-tests.log .github/exact-tool-recovery.py .github/workflows/exact-tool-recovery-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(runtime): preserve admitted tools on recovery"
          git pull --rebase origin main
          git push origin HEAD:main
