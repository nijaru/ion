name: Exact tool recovery once

on:
  push:
    branches: [main]
    paths:
      - .github/exact-tool-recovery.py
      - .github/workflows/exact-tool-recovery-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact tool recovery
        run: python .github/exact-tool-recovery.py
      - run: cargo fmt
      - run: cargo fmt --check
      - name: Strict Clippy
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee .github/exact-tool-recovery-clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/exact-tool-recovery-clippy.log
            if ! git diff --cached --quiet; then
              git commit -m "chore: capture exact recovery clippy failure"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            exit "$status"
          fi
          rm -f .github/exact-tool-recovery-clippy.log
      - run: cargo test --locked --workspace
      - name: Commit validated slice
        run: |
          rm -f .github/exact-tool-recovery-clippy.log .github/exact-tool-recovery.py .github/workflows/exact-tool-recovery-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(runtime): preserve admitted tools on recovery"
          git pull --rebase origin main
          git push origin HEAD:main
