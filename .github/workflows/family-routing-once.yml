name: Durable family routing once

on:
  push:
    branches: [main]
    paths:
      - .github/family-routing-patch.py
      - .github/workflows/family-routing-once.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply family routing slice
        run: python .github/family-routing-patch.py
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Commit validated slice
        run: |
          rm .github/family-routing-patch.py .github/workflows/family-routing-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion-core/src/store/mod.rs crates/ion-core/src/store/sql.rs crates/ion-core/src/agent.rs crates/ion-core/src/delegate.rs crates/ion-core/src/tests/agent_store.rs crates/ion-core/src/tests/agent_family.rs .github/family-routing-patch.py .github/workflows/family-routing-once.yml
          git commit -m "refactor(agent): route by durable family topology"
          git push origin HEAD:main
