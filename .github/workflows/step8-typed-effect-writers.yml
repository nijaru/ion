name: Step 8 typed effect writers

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply typed effect writer migration
        run: |
          python .github/step8_typed_effect_writers.py
          python .github/step8_fix1.py
      - name: Format
        run: cargo fmt --all
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Clippy gate
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test gate
        run: cargo test --locked --workspace
      - name: Commit validated source
        run: |
          git checkout "$GITHUB_HEAD_REF"
          rm .github/step8_typed_effect_writers.py .github/step8_fix1.py .github/workflows/step8-typed-effect-writers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(runtime): use typed durable effect writers"
          git push origin HEAD:"$GITHUB_HEAD_REF"
