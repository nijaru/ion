name: Validate separate session lineage

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply session-lineage patch
        run: python .github/session_lineage_patch.py
      - name: Validate Rust 1.98
        run: |
          cargo fmt
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ion-core/src
          git rm -f .github/session_lineage_patch.py .github/workflows/validate-session-lineage.yml
          git commit -m 'refactor(core): separate control and history lineage'
          git push origin HEAD:main
