name: OpenRouter EOF validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.head_ref == 'agent/openrouter-eof-is-incomplete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact source patch
        run: python3 .github/openrouter_eof_patch.py
      - name: Format source
        run: cargo +1.98.0 fmt --all
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Strict Clippy
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo +1.98.0 test --locked --workspace
      - name: Commit only validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/openrouter_eof_patch.py .github/workflows/openrouter-eof-validation.yml
          git add -A .github crates/ion/src/openrouter.rs
          git commit -m 'fix(openrouter): fail truncated streams'
          git push origin HEAD:${{ github.head_ref }}
