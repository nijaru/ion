name: CI

# Required repository gates run on every push and pull request; the scheduled
# job performs the separate dependency advisory sweep.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly advisory sweep, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build client smoke binaries
        run: cargo build --locked -p ion --bins --example embedded --example restricted --example service --example delegation
      - name: Restricted application smoke
        run: target/debug/examples/restricted "$(mktemp -d)"
      - name: Explicit Turn recovery SDK smoke
        run: python3 scripts/smoke_recovery.py
      - name: Managed delegation and owner-loss SDK smoke
        run: python3 scripts/smoke_delegation.py
      - name: Coding subagent consumer smoke
        run: python3 scripts/smoke_subagent.py
      - name: Receiver-owned managed completion smoke
        run: python3 scripts/smoke_completion.py
      - name: Coding child route and reasoning smoke
        run: python3 scripts/smoke_subagent_routing.py
      - name: Bounded coding child wait-any smoke
        run: python3 scripts/smoke_subagent_wait.py
      - name: Coding child execution deadline smoke
        run: python3 scripts/smoke_subagent_deadline.py
      - name: Live coding child steering smoke
        run: python3 scripts/smoke_subagent_steering.py
      - name: Retained coding child conversation resume smoke
        run: python3 scripts/smoke_subagent_resume.py
      - name: Bounded coding foreground join smoke
        run: python3 scripts/smoke_subagent_join.py
      - name: Retained service attachment SDK smoke
        run: target/debug/examples/service "$(mktemp -d)"
      - name: Embedded SDK custody smoke
        run: python3 scripts/smoke_embedded.py
      - name: Install native-scrollback test terminal
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Headless coding and recovery smoke
        run: bash scripts/smoke.sh && python3 scripts/smoke_headless.py
      - name: CLI invocation and input boundary smoke
        run: python3 scripts/smoke_cli.py
      - name: Anthropic signed replay and migration smoke
        run: python3 scripts/smoke_anthropic.py
      - name: Responses stateless replay and effect-fence smoke
        run: python3 scripts/smoke_responses.py
      - name: Fixed coding qualification smoke
        run: python3 scripts/smoke_coding.py
      - name: Native web retrieval smoke
        run: python3 scripts/smoke_web.py
      - name: Native file boundary smoke
        run: python3 scripts/smoke_file_io.py
      - name: Image input, recovery and inspection smoke
        run: python3 scripts/smoke_images.py
      - name: Terminal PTY smoke
        run: python3 scripts/test_terminal_style.py && python3 scripts/smoke_terminal.py
      - name: Keyboard surface custody smoke
        run: python3 scripts/smoke_keyboard.py
      - name: Unix shell job-control smoke
        run: python3 scripts/smoke_job_control.py
      - name: Inline native-scrollback smoke
        run: python3 scripts/smoke_scrollback.py
      - name: Direct shell PTY smoke
        run: python3 scripts/smoke_shell.py
      - name: Direct shell admission and recovery smoke
        run: python3 scripts/smoke_shell_recovery.py
      - name: RPC smoke
        run: python3 scripts/smoke_rpc.py
      - name: RPC same-Turn question smoke
        run: python3 scripts/smoke_rpc_questions.py
      - name: RPC durable request admission and process-loss smoke
        run: python3 scripts/smoke_rpc_requests.py
      - name: RPC direct-shell authority and recovery smoke
        run: python3 scripts/smoke_rpc_shell.py
      - name: Operator tool veto smoke
        run: python3 scripts/smoke_tool_veto.py
      - name: Code Mode effect and inspection smoke
        run: python3 scripts/smoke_code_mode.py
      - name: MCP refresh smoke
        run: python3 scripts/smoke_mcp.py
      - name: Explicit shared MCP reconnect smoke
        run: python3 scripts/smoke_mcp_reconnect.py
      - name: MCP configuration helper smoke
        run: python3 scripts/smoke_mcp_values.py
      - name: MCP output conformance smoke
        run: python3 scripts/smoke_mcp_schema.py
      - name: Selected-point fork smoke
        run: python3 scripts/smoke_fork.py
      - name: Input custody smoke
        run: python3 scripts/smoke_input.py
      - name: Resource reload smoke
        run: python3 scripts/smoke_resources.py

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
