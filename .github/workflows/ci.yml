name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep tmux

      - name: Install Go quality tools
        run: |
          tool_dir="${RUNNER_TEMP}/ion-go-tools"
          GOBIN="$tool_dir" go install github.com/segmentio/golines@v0.13.0
          GOBIN="$tool_dir" go install mvdan.cc/gofumpt@v0.10.0
          GOBIN="$tool_dir" go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          GOBIN="$tool_dir" go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Go format
        run: scripts/go-format.sh --check

      - name: Test
        run: go test ./... -count=1 -timeout 300s

      - name: Race
        run: go test -race ./... -count=1 -timeout 900s

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Build
        run: go build ./...

      - name: Clean install and version smoke
        run: |
          install_dir="${RUNNER_TEMP}/ion-bin"
          mkdir -p "$install_dir"
          GOBIN="$install_dir" go install ./cmd/ion
          "$install_dir/ion" --version

      - name: Linux sandbox boundary
        run: go test ./tool -run '^TestBubblewrapBashEnforcesWorkspaceBoundary$' -count=1 -timeout 120s

      - name: TUI and terminal acceptance
        run: bash scripts/smoke/p1-scenario-traces.sh

      - name: Performance baseline
        run: |
          ION_PERF_COUNT=1 ION_PERF_HYPERFINE_RUNS=3 \
            bash scripts/smoke/p1-performance-proof.sh
