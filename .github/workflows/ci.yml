name: CI

# Required repository gates run on every push and pull request; the scheduled
# job performs the separate dependency advisory sweep.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly advisory sweep, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build terminal smoke binary
        run: cargo build --locked -p ion
      - name: Terminal PTY smoke
        run: python3 scripts/smoke_terminal.py
      - name: Direct shell PTY smoke
        run: python3 scripts/smoke_shell.py
      - name: RPC smoke
        run: python3 scripts/smoke_rpc.py
      - name: Code Mode effect and inspection smoke
        run: python3 scripts/smoke_code_mode.py
      - name: MCP refresh smoke
        run: python3 scripts/smoke_mcp.py
      - name: Selected-point fork smoke
        run: python3 scripts/smoke_fork.py
      - name: Resource reload smoke
        run: python3 scripts/smoke_resources.py

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
