[package]
name = "ion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ion durable runtime, session, tool, and frontend contract"

[dependencies]
globset = "0.4.20"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["fs"] }
regex = "1.13.1"
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tokio-util.workspace = true
tracing.workspace = true
uuid = { version = "1.24.1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
