[package]
name = "ion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ion durable coding-turn runtime"

[dependencies]
async-stream = "0.3.6"
bytes = "1.11.1"
futures-util = "0.3.34"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
ion-ai.workspace = true
jsonschema = { version = "0.57.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid = { version = "1.24.1", features = ["v7", "serde"] }

[lints]
workspace = true
